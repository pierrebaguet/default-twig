framework:
    rate_limiter:
        # Password reset links an administrator sends from the customer sheet. Keyed on the
        # customer: the mail goes to someone else's mailbox, and three an hour leaves room for
        # "it did not arrive, send it again" while stopping a sheet from being used to flood it.
        # Kept apart from the core limiters of the front-office request, which are keyed on the
        # caller's address and would spend the customer's own budget.
        admin_customer_password_reset:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        # A re-verification reaches an outside authority, on a button an
        # administrator can hold down. The window is per administrator, generous
        # enough for a day of legitimate corrections and narrow enough that the
        # back office cannot be turned into a probe against that authority.
        vat_reverification:
            policy: 'sliding_window'
            limit: 30
            interval: '15 minutes'
        # A test request reaches an address an administrator typed, on a button that can be held
        # down: it must not turn the back office into a way to hammer a third party. Per administrator.
        webhook_test:
            policy: 'sliding_window'
            limit: 10
            interval: '5 minutes'
        # A replay sends the stored request again, to the address of the subscription. Held to a
        # window of its own so that a screen cannot be used to send the same request in a loop.
        webhook_replay:
            policy: 'sliding_window'
            limit: 20
            interval: '5 minutes'
        # A connection test is a real call to an AI provider, billed to the shop, on a button that can be held
        # down. Per administrator.
        ai_connection_test:
            policy: 'sliding_window'
            limit: 10
            interval: '5 minutes'
        # An edit of an order moves the stock and the amounts the customer is invoiced. Per administrator.
        order_edit:
            policy: 'sliding_window'
            limit: 30
            interval: '15 minutes'
        # The preview of an edit writes nothing but runs the whole tax and stock computation under a row lock: one call per field left, so more room than the edit itself.
        order_edit_preview:
            policy: 'sliding_window'
            limit: 120
            interval: '15 minutes'
        # The global search of the top bar runs up to twelve queries, most of them scans on a
        # large catalogue. Per administrator: far above what a person types, low enough that a
        # script cannot keep the database busy through it.
        admin_search:
            policy: 'sliding_window'
            limit: 120
            interval: '1 minute'
